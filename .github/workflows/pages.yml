# Publishes the demo (index.html and the files it loads) to GitHub Pages on every push to main.
# The Node.js server (server/) is left out: on Pages the demo runs without a database.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned by commit (the tag can be moved), with the release they are in.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false   # nothing here pushes: do not leave the token in .git/config

      - name: Collect the demo files
        run: |
          mkdir _site
          cp -r index.html demo.js demo.css agendo.js agendo.css events.json LICENSE README.md assets data plugins themes _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
